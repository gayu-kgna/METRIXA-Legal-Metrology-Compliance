services:
  metrixa-db:
    image: postgres:16-alpine
    container_name: metrixa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metrixa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metrixa_secret_dev_2026}
      POSTGRES_DB: ${POSTGRES_DB:-metrixa_db}
    ports:
      - "5432:5432"
    volumes:
      - metrixa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metrixa} -d ${POSTGRES_DB:-metrixa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  metrixa_pgdata:
